# These were the upstream esp-hosted-mcu example's debug-console dependencies
# (cmd_system, iperf/iperf-cmd, wifi-cmd, ping-cmd, mqtt) — all gated behind
# Kconfig options this project leaves off by default (CONFIG_ESP_HOSTED_CLI_ENABLED,
# CONFIG_ESP_HOSTED_COPROCESSOR_EXAMPLE_MQTT), so nothing in c6_slave actually
# needs them. Removed because one of them (cmd_system, a `path:` dependency
# under $IDF_PATH) trips a Windows-only idf-component-manager bug when the
# project and ESP-IDF tools live on different drive letters (lock-file writer
# can't express a relative path across drives). Re-add them (and re-enable the
# matching Kconfig options) if this project's console-CLI/iperf/mqtt debug
# tooling is ever needed.
dependencies: {}
