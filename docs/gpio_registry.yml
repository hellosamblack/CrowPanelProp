  - gpio: 34
    status: claimed         # SEN0395 UART1 TX — prop_aux_radar.c
    function: SEN0395 DFRobot 24GHz mmWave UART1 TX
    connector_pin: J10/1
    file: main/prop_aux_radar.c
    caps: [gpio_matrix, uart3_tx, strapping_jtag_sel]
    notes: >
      J10 UART1 TX (routed via GPIO matrix). SEN0395 moved here from J7/GPIO25.
      Strapping pin: JTAG_SEL sampled at boot; pull-up holds high (JTAG
