# GPIO Registry — CrowPanel ESP32-P4 7" (Elecrow V1.0)
#
# Single source of truth for pin assignments in this project.
# Claude reads this before recommending pins and UPDATES it when assigning new ones.
#
# status values:
#   claimed   — permanently in use by core firmware; never reassign
#   shared    — managed by bsp_aio as general-purpose AIO; can be re-purposed by agreement
#   radar     — used when radar peripheral is active (prop_radar.c); free when radar is disabled
#   radio     — allocated for SX1262/nRF24 when a radio module is fitted; free otherwise
#   pending   — placeholder wiring not yet hardware-verified (bsp_io.c comment warns)
#   available — free for new peripheral assignment
#
# connector_pin: "J7/9" means connector J7, physical pin 9
# gpio_caps: abbreviated capability flags (see board-io skill for full table)

gpios:

  # ── LP-domain GPIOs (GPIO0–15) ─────────────────────────────────────────────
  # These survive deep-sleep when powered by VDD_LP. All support capacitive touch
  # sensing and are in the fully-connected GPIO matrix for UART/SPI/I2C/PWM/etc.

  - gpio: 2
    status: shared          # bsp_aio "IO2 HDR"
    function: AIO bench (general digital I/O)
    connector_pin: J7/9
    file: components/bsp_aio/bsp_aio.c:19
    caps: [lp_gpio, touch_ch1, jtag_tck, gpio_matrix]
    notes: JTAG TCK alternate. LP-capable.

  - gpio: 3
    status: shared          # bsp_aio "IO3 HDR"
    function: AIO bench (general digital I/O)
    connector_pin: J7/11
    file: components/bsp_aio/bsp_aio.c:20
    caps: [lp_gpio, touch_ch2, jtag_tdi, gpio_matrix]
    notes: JTAG TDI alternate. LP-capable.

  - gpio: 4
    status: shared          # bsp_aio "IO4 HDR"
    function: AIO bench (general digital I/O)
    connector_pin: J7/13
    file: components/bsp_aio/bsp_aio.c:21
    caps: [lp_gpio, touch_ch3, jtag_tms, gpio_matrix]
    notes: JTAG TMS alternate. LP-capable.

  - gpio: 5
    status: shared          # bsp_aio "IO5 HDR"
    function: AIO bench (general digital I/O)
    connector_pin: J7/15
    file: components/bsp_aio/bsp_aio.c:22
    caps: [lp_gpio, touch_ch4, jtag_tdo, gpio_matrix]
    notes: JTAG TDO alternate. LP-capable.

  - gpio: 6
    status: radio           # bsp_aio "IO6 COMM" — radio SPI MOSI when radio fitted
    function: Radio SPI MOSI / AIO comm socket
    connector_pin: J9/4
    file: components/bsp_aio/bsp_aio.c:30
    caps: [lp_gpio, touch_ch5, spi2_hold, gpio_matrix]
    notes: J9 SPI2 MOSI. Free when no radio module. LP-capable.

  - gpio: 7
    status: radio           # bsp_aio "IO7 COMM" — radio SPI MISO when radio fitted
    function: Radio SPI MISO / AIO comm socket
    connector_pin: J9/3
    file: components/bsp_aio/bsp_aio.c:31
    caps: [lp_gpio, touch_ch6, spi2_cs, gpio_matrix]
    notes: J9 SPI2 MISO. Free when no radio module. LP-capable.

  - gpio: 8
    status: radio           # bsp_aio "IO8 COMM" — radio SPI CLK when radio fitted
    function: Radio SPI CLK / AIO comm socket
    connector_pin: J9/2
    file: components/bsp_aio/bsp_aio.c:32
    caps: [lp_gpio, touch_ch7, spi2_d, gpio_matrix]
    notes: J9 SPI2 SCK. Free when no radio module. LP-capable.

  - gpio: 9
    status: radio           # reserved for Radio IRQ (CLAUDE.md)
    function: Radio IRQ (SX1262 DIO1 / nRF24 IRQ)
    connector_pin: J11/5
    file: CLAUDE.md
    caps: [lp_gpio, touch_ch8, spi2_ck, gpio_matrix]
    notes: J11 IO9_W header pin. Free when no radio. LP-capable.

  - gpio: 10
    status: radio           # bsp_aio "IO10 COMM" — radio NSS/CS when radio fitted
    function: Radio NSS/CS / AIO comm socket
    connector_pin: J11/6
    file: components/bsp_aio/bsp_aio.c:33
    caps: [lp_gpio, touch_ch9, spi2_q, gpio_matrix]
    notes: J11 IO10_W_BUSY header pin. Free when no radio. LP-capable.

  - gpio: 11
    status: pending         # BTN_ACTION placeholder — needs schematic verification
    function: Button Action (placeholder)
    connector_pin: ~        # not yet mapped to a header pin
    file: components/bsp_io/bsp_io.c:27
    caps: [lp_gpio, touch_ch10, gpio_matrix]
    notes: "bsp_io.c comment: candidate free pin; verify before wiring"

  - gpio: 14
    status: claimed
    function: SDIO D0 — ESP32-C6 WiFi co-processor
    connector_pin: ~
    file: sdkconfig.defaults:56
    caps: [lp_gpio, touch_ch13, gpio_matrix]
    notes: CONFIG_ESP_HOSTED_SDIO_PIN_D0. Do not reassign.

  - gpio: 15
    status: claimed
    function: SDIO D1 — ESP32-C6 WiFi co-processor
    connector_pin: ~
    file: sdkconfig.defaults:57
    caps: [lp_gpio, touch_ch14, gpio_matrix]
    notes: CONFIG_ESP_HOSTED_SDIO_PIN_D1. Do not reassign.

