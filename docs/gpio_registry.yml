  - gpio: 32
    status: claimed
    function: SDIO Reset — ESP32-C6 WiFi co-processor
    connector_pin: ~
    file: sdkconfig.defaults:53
    caps: [gpio_matrix]
    notes: CONFIG_ESP_HOSTED_SDIO_GPIO_RESET_SLAVE

  - gpio: 33
