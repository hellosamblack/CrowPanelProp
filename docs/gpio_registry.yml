  - gpio: 52
    status: shared          # bsp_aio "IO52 HDR" — ADC2 ch3
    function: AIO bench (ADC2 ch3 / digital I/O)
    connector_pin: J7/12
    file: components/bsp_aio/bsp_aio.c:29
    caps: [gpio_matrix, adc2_ch3, acomp_in]
    notes: ADC2 ch3. Also Analog Comparator 0 non-inverting input.

  - gpio: 53
    status: claimed         # LD2450 MOTION_TX_GPIO — UART2 TX — prop_motion.c
    function: LD2450 24GHz mmWave UART2 TX
    connector_pin: J9/1
    file: main/prop_motion.c
    caps: [gpio_matrix, uart2_tx, adc2_ch4, acomp_ref]
    notes: >
      MOTION_TX_GPIO = 53. UART2 at 256000 baud. Removed from bsp_aio
      s_pins[]. Replaces prop_radar.c which is now dead code.

  - gpio: 54
    status: claimed         # LD2450 MOTION_RX_GPIO — UART2 RX — prop_motion.c
    function: LD2450 24GHz mmWave UART2 RX
    connector_pin: J11/1
    file: main/prop_motion.c
    caps: [gpio_matrix, uart2_rx, adc2_ch5, acomp_in]
    notes: >
      MOTION_RX_GPIO = 54. UART2 at 256000 baud. Removed from bsp_aio
      s_pins[]. Replaces prop_radar.c which is now dead code.

  # ── I2C1 bus (shared with touchscreen — use with caution) ──────────────────
  # These are not standard GPIO entries because they're managed by the touch
  # driver at 1.8V (ESP32-P4 side) with BSS138 level shifters to 3.3V on headers.
  # The 3.3V side is broken out on J11 pins 2-3 and J13 pins 1-2.

  - gpio: i2c1_scl_3v3     # not a GPIO number — a shared bus endpoint
    status: pseudo_available
    function: I2C1 SCL (touchscreen bus, 3.3V side)
    connector_pin: J11/2, J13/1
    file: components/bsp_i2c/include/bsp_i2c.h
    caps: [i2c]
    notes: >
      Shared with GT911 touchscreen (addr 0x14/0x5D, always active), STC8
      co-processor (via R188), and unpopulated ES8311/ES7210 footprints.
      MPU-6050 IMU (addr 0x68) added via J13 Grove connector (prop_imu.c);
      no address conflict with GT911. Uses i2c_dev_register(0x68) on the
      existing i2c_bus_handle.

  - gpio: i2c1_sda_3v3
    status: pseudo_available
    function: I2C1 SDA (touchscreen bus, 3.3V side)
    connector_pin: J11/3, J13/2
    file: components/bsp_i2c/include/bsp_i2c.h
    caps: [i2c]
    notes: Same sharing constraints as I2C1 SCL. MPU-6050 also on this bus.
