dependencies:
  idf:
    version: '>=5.4.2'
  # Display + touch + LVGL (same versions as Lesson09)
  espressif/esp_lcd_ek79007: ^1.0.2
  espressif/esp_lvgl_port: ^2.6.0
  espressif/esp_lcd_touch_gt911: ^1.1.3
  lvgl/lvgl: ^8.3.11
  # cJSON: removed from IDF core in 6.0, now pulled from the registry
  espressif/cjson: '*'
  # WiFi via the onboard ESP32-C6 co-processor.
  # esp_wifi_remote 1.x is the line that targets IDF 6.0 (0.x referenced the
  # removed esp_interface.h). Let the resolver pick a coherent hosted+remote pair.
  espressif/esp_hosted:
    rules:
      - if: target in [esp32p4]
    version: '>=2.12.9'
  espressif/esp_wifi_remote:
    rules:
      - if: target in [esp32p4]
    version: '>=1.6.0'
