dependencies:
  idf:
    version: '>=5.4.2'
  # Display + touch + LVGL (same versions as Lesson09)
  espressif/esp_lcd_ek79007: ^1.0.2
  espressif/esp_lvgl_port: ^2.6.0
  espressif/esp_lcd_touch_gt911: ^1.1.3
  # LVGL 9. esp_lvgl_port 2.8 already ships an lvgl9 source path (idf_component.yml
  # declares lvgl >=8,<10), so no port major bump is needed — bumping this pin and
  # re-resolving flips the whole stack onto the v9 implementation.
  # NB: must be >=9.3 — esp_lvgl_port 2.8's lvgl9 disp code references
  # LV_COLOR_FORMAT_RGB565_SWAPPED, which only exists from LVGL 9.3.0 onward.
  lvgl/lvgl: '>=9.3.0,<10'
  # cJSON: removed from IDF core in 6.0, now pulled from the registry
  espressif/cjson: '*'
  # mDNS: advertise <PROP_HOSTNAME>.local + the _http._tcp web console
  espressif/mdns: '*'
  # LiDAR thin-client render stream: outbound WS client to lidar-roomscanner's
  # /ws-thin endpoint (docs/superpowers/specs/2026-08-17-lidar-thin-client-crowpanel-design.md)
  espressif/esp_websocket_client: '*'
  # WiFi via the onboard ESP32-C6 co-processor.
  # esp_wifi_remote 1.x is the line that targets IDF 6.0 (0.x referenced the
  # removed esp_interface.h). Let the resolver pick a coherent hosted+remote pair.
  espressif/esp_hosted:
    rules:
      - if: target in [esp32p4]
    version: '>=2.12.9'
  espressif/esp_wifi_remote:
    rules:
      - if: target in [esp32p4]
    version: '>=1.6.0'
